{
  "delegation_timeout": {
    "enabled": true,
    "default_timeout_minutes": 60,
    "timeout_by_priority": {
      "critical": 30,
      "high": 45,
      "normal": 60,
      "low": 120
    },
    "timeout_by_status": {
      "in_progress": 60
    },
    "mark_execution_failed_on_timeout": true,
    "mark_task_failed_on_timeout": false,
    "require_human_review_for_critical": true,
    "dry_run_default": true,
    "max_timeouts_per_run": 50
  }
}
