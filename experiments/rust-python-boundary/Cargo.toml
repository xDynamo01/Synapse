[package]
name = "synapse-boundary-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
pyo3 = { version = "=0.30.1", features = ["auto-initialize"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
