[project]
name = "synapse-runtime-compatibility"
version = "0.0.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "anyio==4.16.0",
  "pydantic==2.14.3",
  "ctranslate2==4.8.5",
  "faster-whisper==1.2.1",
  "piper-tts==1.8.0",
  "onnxruntime==1.31.1",
  "aiosqlite==0.22.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "psutil==7.2.2"]

[tool.uv]
package = false
no-build = true

[tool.pytest.ini_options]
testpaths = ["tests"]
