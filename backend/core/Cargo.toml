[package]
name = "synapse-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "synapse_core"

[[bin]]
name = "synapse-backend"
path = "src/main.rs"

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "=0.11.0"
sha2.workspace = true
url = "=2.5.8"

[features]
test-fault-injection = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Globalization"] }

[dev-dependencies]
tempfile.workspace = true
