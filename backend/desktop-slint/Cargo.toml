[package]
name = "synapse-desktop-slint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
tiny-skia = "=0.12.0"
synapse-core = { path = "../core" }
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
cpal = "=0.17.3"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

[build-dependencies]
slint-build = "=1.19.0"
embed-resource = "=3.0.12"
resvg = { version = "=0.49.0", default-features = false }

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
