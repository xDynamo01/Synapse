name: Platform package

on:
  push:
    branches:
      - platform/windows
      - platform/linux
      - platform/macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: contains(fromJSON('["platform/windows","platform/linux","platform/macos"]'), github.ref_name)
    runs-on: ${{ fromJSON('{"platform/windows":"windows-2025","platform/linux":"ubuntu-24.04","platform/macos":"macos-15"}')[github.ref_name] }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Run Rust tests
        run: cargo +1.96.0 test --locked --workspace --all-features
      - name: Run Python tests
        run: python -m unittest discover -s backend/python/tests
      - name: Build release
        run: cargo +1.96.0 build --locked --workspace --release
      - name: Verify release binaries
        run: python tools/release/smoke.py target/release
      - name: Package verified binaries
        run: python tools/release/package.py build --version 0.3.0 --output release-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: synapse-0.3.0-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/*
          if-no-files-found: error
